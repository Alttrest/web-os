            <text x="14" y="42" fill="#38bdf8" font-family="monospace" font-size="9">def</text>
            <text x="36" y="42" fill="#f1f5f9" font-family="monospace" font-size="9">boot_system():</text>
            <text x="24" y="62" fill="#64748b" font-family="monospace" font-size="9">mount_vfs('/root')</text>
            <text x="24" y="82" fill="#10b981" font-family="monospace" font-size="9">return "READY"</text>
          </g>

          <!-- Window 2: 3D Scene Viewer -->
