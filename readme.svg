          <text x="14" y="48" fill="#a855f7" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">IndexedDB VFS</text>
        </g>
        
        <g transform="translate(310, 0)">
          <rect width="145" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
          <text x="14" y="24" fill="#64748b" font-family="monospace" font-size="10">AUDIO</text>
          <text x="14" y="48" fill="#10b981" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Web Audio Synth</text>
        </g>
        
    </g>

    <!-- Detailed Highlights -->
    <g transform="translate(0, 255)">
      <text x="0" y="0" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">CORE SYSTEM ARCHITECTURE:</text>
      
        <text x="0" y="22" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">● Layered windowing manager with fluid glassmorphic micro-i...</text>
        
        <text x="0" y="42" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">● Virtual File System (VFS) with persistent browser Indexed...</text>
        
        <text x="0" y="62" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">● Installed suite including Python IDE, 3D Scene Studio, an...</text>
        
    </g>
  </g>

  <!-- Right Column: Bespoke Visual Representation -->
  <g transform="translate(680, 50)">
    
        <g transform="translate(20, 20)">
          <!-- Desktop Surface -->
          <rect width="420" height="310" rx="8" fill="#070d1e" stroke="#1e3a8a" stroke-width="1.5"/>
          <rect width="420" height="22" rx="8" fill="#0f172a"/>
          <text x="14" y="15" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="700"> alttre.os</text>
          <text x="90" y="15" fill="#94a3b8" font-family="sans-serif" font-size="9">File</text>
          <text x="120" y="15" fill="#94a3b8" font-family="sans-serif" font-size="9">View</text>
          <text x="375" y="15" fill="#38bdf8" font-family="monospace" font-size="9">100% 🔋</text>

          <!-- Window 1: Code Studio -->
          <g transform="translate(25, 38)">
            <rect width="250" height="160" rx="6" fill="#020617" stroke="#38bdf8" stroke-width="1" opacity="0.95"/>
            <path d="M 0 6 C 0 2.5 2.5 0 6 0 L 244 0 C 247.5 0 250 2.5 250 6 L 250 20 L 0 20 Z" fill="#0f172a"/>
            <circle cx="10" cy="10" r="2.5" fill="#ef4444"/>
            <circle cx="18" cy="10" r="2.5" fill="#f59e0b"/>
            <circle cx="26" cy="10" r="2.5" fill="#10b981"/>
