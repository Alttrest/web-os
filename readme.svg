            <rect width="220" height="145" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1" opacity="0.95"/>
            <path d="M 0 6 C 0 2.5 2.5 0 6 0 L 214 0 C 217.5 0 220 2.5 220 6 L 220 20 L 0 20 Z" fill="#1e1b4b"/>
            <circle cx="10" cy="10" r="2.5" fill="#ef4444"/>
            <circle cx="18" cy="10" r="2.5" fill="#f59e0b"/>
            <circle cx="26" cy="10" r="2.5" fill="#10b981"/>
            <text x="38" y="14" fill="#c084fc" font-family="monospace" font-size="8">3D Scene Studio</text>
            <polygon points="110,45 135,60 110,75 85,60" fill="none" stroke="#c084fc" stroke-width="1.5"/>
            <polygon points="110,75 135,60 135,90 110,105" fill="none" stroke="#a855f7" stroke-width="1.5"/>
            <polygon points="110,75 85,60 85,90 110,105" fill="none" stroke="#7e22ce" stroke-width="1.5"/>
          </g>

          <!-- Dock -->
          <g transform="translate(90, 265)">
            <rect width="240" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.9"/>
            <circle cx="30" cy="17" r="10" fill="#38bdf8"/>
            <circle cx="70" cy="17" r="10" fill="#a855f7"/>
            <circle cx="110" cy="17" r="10" fill="#10b981"/>
            <circle cx="150" cy="17" r="10" fill="#f59e0b"/>
            <circle cx="190" cy="17" r="10" fill="#ef4444"/>
          </g>
        </g>
        
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(60, 515)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="22" fill="#64748b" font-family="monospace" font-size="11">REPOSITORY: Alttrest/alttre.os</text>
    <text x="400" y="22" fill="#64748b" font-family="monospace" font-size="11">MAINTAINER: Ali Turan (@Alttrest)</text>
    <text x="960" y="22" fill="#38bdf8" font-family="monospace" font-size="11">● PRODUCTION VERIFIED</text>
  </g>
</svg>